<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#272c70" />
    <title>Real Love is offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #252844; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 30rem; padding: 28px; border: 1px solid #e3e4ec; border-radius: 16px; background: white; text-align: center; }
      h1 { font-family: Georgia, serif; font-weight: 400; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 8px; background: #292e72; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline.</h1>
      <p>Your device could not reach Real Love. Check your connection and try again. Drafts already stored on this device are not sent by this screen.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
